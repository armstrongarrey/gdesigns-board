<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="G-DESIGNS LTD Strategic Board of Directors — AI-powered advisory council">
<title>G-DESIGNS Board of Directors</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e0b1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="G-DESIGNS Board">
<style>
  :root {
    --purple: #6C3Bff;
    --bg: #0e0b1a;
    --bg2: #14102a;
    --bg3: #1a1438;
    --bg4: #090717;
    --border: #2a1f4e;
    --border2: #1a1030;
    --text: #e8e0ff;
    --text2: #c8b8f0;
    --muted: #5a4a7a;
    --muted2: #3a2f5a;
    --green: #4a9a4a;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }

  /* HEADER */
  .hdr {
    background: #1a0e3a;
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    gap: 10px;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .lmark {
    width: 34px; height: 34px; background: var(--purple);
    border-radius: 8px; display: flex; align-items: center;
    justify-content: center; font-weight: 700; font-size: 14px;
    color: #fff; flex-shrink: 0;
  }
  .ltitle h1 { font-size: 14px; font-weight: 600; color: var(--text); line-height: 1.2; }
  .ltitle p { font-size: 9.5px; color: var(--purple); letter-spacing: 0.09em; text-transform: uppercase; }
  .spill { font-size: 10px; color: var(--muted); display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .sdot { width: 5px; height: 5px; border-radius: 50%; background: var(--purple); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* DIRECTOR SCROLL */
  .dir-scroll {
    display: flex; gap: 7px; padding: 9px 14px;
    overflow-x: auto; border-bottom: 1px solid var(--border2);
    scrollbar-width: none; flex-shrink: 0;
  }
  .dir-scroll::-webkit-scrollbar { display: none; }
  .dchip {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 11px 5px 6px;
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 20px; cursor: pointer; white-space: nowrap;
    transition: all 0.15s; flex-shrink: 0; user-select: none;
  }
  .dchip:hover { border-color: var(--purple); background: var(--bg3); }
  .dchip.active { border-color: var(--purple); background: #1e1540; }
  .dav { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 700; flex-shrink: 0; }
  .dchip-name { font-size: 11px; color: var(--text2); font-weight: 500; }
  .dchip.active .dchip-name { color: var(--text); }

  /* MAIN AREA */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  /* SPLASH */
  .splash {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px; padding: 2rem; text-align: center;
  }
  .sp-icon { font-size: 40px; opacity: 0.2; }
  .sp-t { font-size: 16px; font-weight: 500; color: #4a3a7a; }
  .sp-s { font-size: 13px; color: var(--muted2); max-width: 280px; line-height: 1.7; }
  .sp-arrow { font-size: 20px; color: #2a1f4e; margin-top: 4px; }

  /* CHAT */
  .chatbox { flex: 1; display: none; flex-direction: column; overflow: hidden; }
  .chatbox.show { display: flex; }

  .who-bar {
    display: flex; align-items: center; gap: 9px;
    padding: 9px 14px; background: #120f28;
    border-bottom: 1px solid var(--border2); flex-shrink: 0;
  }
  .who-av { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; }
  .who-n { font-size: 13px; font-weight: 500; color: var(--text2); }
  .who-r { font-size: 10px; color: var(--muted); }
  .who-status { margin-left: auto; font-size: 10px; color: var(--green); display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .odot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }

  /* MESSAGES */
  .msgs {
    flex: 1; overflow-y: auto; padding: 14px;
    display: flex; flex-direction: column; gap: 2px;
    background: var(--bg4);
    -webkit-overflow-scrolling: touch;
  }
  .msgs::-webkit-scrollbar { width: 3px; }
  .msgs::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .mrow { display: flex; gap: 7px; align-items: flex-end; }
  .mrow.me { flex-direction: row-reverse; }
  .mav2 { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 700; flex-shrink: 0; }
  .bub {
    max-width: 78%; padding: 9px 12px;
    font-size: 13.5px; line-height: 1.65;
  }
  .mrow.them .bub {
    background: var(--bg3); border: 1px solid var(--border);
    color: var(--text2); border-radius: 14px 14px 14px 3px;
  }
  .mrow.me .bub {
    background: var(--purple); color: #fff;
    border-radius: 14px 14px 3px 14px;
  }
  .mtime { font-size: 9px; color: #252035; padding: 2px 32px 10px; }
  .mrow.me + .mtime { text-align: right; }
  .mrow.them + .mtime { text-align: left; }

  .typing-row { display: flex; gap: 7px; align-items: flex-end; margin-bottom: 4px; }
  .tpill {
    display: flex; gap: 4px; align-items: center;
    padding: 10px 13px; background: var(--bg3);
    border: 1px solid var(--border); border-radius: 14px 14px 14px 3px;
  }
  .td { width: 6px; height: 6px; border-radius: 50%; background: var(--purple); animation: tb 1.2s infinite; }
  .td:nth-child(2){animation-delay:.2s} .td:nth-child(3){animation-delay:.4s}
  @keyframes tb{0%,80%,100%{opacity:.2}40%{opacity:1}}

  /* QUICK CHIPS */
  .qrow {
    display: flex; flex-wrap: wrap; gap: 6px;
    padding: 8px 14px; border-top: 1px solid var(--border2);
    background: var(--bg); flex-shrink: 0;
  }
  .qc {
    font-size: 11px; padding: 5px 10px;
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 14px; color: #6a50a0; cursor: pointer;
    transition: all 0.12s; white-space: nowrap; user-select: none;
  }
  .qc:hover, .qc:active { border-color: var(--purple); color: var(--text2); }

  /* INPUT */
  .inrow {
    display: flex; gap: 8px; align-items: flex-end;
    padding: 8px 12px 10px; background: var(--bg);
    border-top: 1px solid var(--border2); flex-shrink: 0;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
  }
  textarea#ti {
    flex: 1; background: var(--bg2);
    border: 1px solid var(--border); border-radius: 11px;
    outline: none; color: var(--text2);
    font-size: 14px; font-family: inherit;
    resize: none; min-height: 40px; max-height: 110px;
    line-height: 1.5; padding: 9px 12px;
    transition: border-color 0.15s;
    -webkit-appearance: none;
  }
  textarea#ti:focus { border-color: var(--purple); }
  textarea#ti::placeholder { color: var(--muted2); }
  .sbtn {
    background: var(--purple); border: none; border-radius: 10px;
    width: 40px; height: 40px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; color: #fff; transition: opacity 0.12s;
    font-size: 18px; -webkit-appearance: none;
  }
  .sbtn:hover { opacity: 0.85; }
  .sbtn:active { opacity: 0.7; transform: scale(0.96); }
  .sbtn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* ERROR */
  .err-bar {
    font-size: 11.5px; color: #ff9090; background: #1a0808;
    border-top: 1px solid #3a1010; padding: 7px 14px;
    text-align: center; display: none; flex-shrink: 0;
  }
  .err-bar.show { display: block; }

  /* FOOTER */
  .ftr {
    padding: 5px 14px; background: #080615;
    border-top: 1px solid #0e0b1a;
    display: flex; justify-content: space-between; flex-shrink: 0;
  }
  .ftr span { font-size: 9px; color: #1a1530; }

  /* MOBILE adjustments */
  @media (max-width: 480px) {
    .hdr { padding: 10px 12px; }
    .ltitle h1 { font-size: 13px; }
    .bub { font-size: 13px; max-width: 85%; }
  }
</style>
</head>
<body>

<header class="hdr" role="banner">
  <div class="logo">
    <div class="lmark">G</div>
    <div class="ltitle">
      <h1>G-DESIGNS Board of Directors</h1>
      <p>Strategic Intelligence Council</p>
    </div>
  </div>
  <div class="spill"><div class="sdot"></div>Board in session</div>
</header>

<nav class="dir-scroll" id="dirScroll" aria-label="Board members"></nav>

<main class="main" role="main">
  <div class="splash" id="splash">
    <div class="sp-icon">🏛️</div>
    <div class="sp-t">Your Board Awaits</div>
    <div class="sp-s">Select any director above, then type your business challenge naturally — just like a real conversation.</div>
    <div class="sp-arrow">↑ Scroll and choose a director</div>
  </div>

  <section class="chatbox" id="chatbox" aria-label="Board consultation chat">
    <div class="who-bar" id="whoBar"></div>
    <div class="msgs" id="msgs" role="log" aria-live="polite"></div>
    <div class="err-bar" id="errBar"></div>
    <div class="qrow" id="qrow" aria-label="Quick questions"></div>
    <div class="inrow">
      <textarea id="ti" placeholder="Type your message..." rows="1" aria-label="Your message"></textarea>
      <button class="sbtn" id="sbtn" aria-label="Send message">↑</button>
    </div>
  </section>
</main>

<footer class="ftr" role="contentinfo">
  <span>Powered by Claude AI</span>
  <span>G-DESIGNS LTD · Learn. Create. Innovate.</span>
</footer>

<script src="app.js"></script>
</body>
</html>
