<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Invitation — Arreyon Consult</title>
<meta name="theme-color" content="#0e0b1a">
<style>
:root {
  --purple:#6C3Bff; --bg:#0e0b1a; --bg2:#14102a; --bg3:#1a1438; --bg4:#090717;
  --border:#2a1f4e; --border2:#1a1030; --text:#e8e0ff; --text2:#c8b8f0;
  --muted:#5a4a7a; --muted2:#3a2f5a; --green:#10a37f; --gold:#e6aa00;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{max-width:440px;width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:32px 28px;text-align:center}
.mark{width:48px;height:48px;background:var(--purple);border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:#fff;margin:0 auto 18px}
h1{font-size:19px;font-weight:700;margin-bottom:8px}
p{font-size:13.5px;color:var(--text2);line-height:1.6;margin-bottom:20px}
.btn{display:inline-block;background:var(--purple);color:#fff;border:none;border-radius:9px;padding:12px 24px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;font-family:inherit;width:100%}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--text2);margin-top:10px}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--purple);border-radius:50%;margin:0 auto 16px;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{background:#2a0a0a;border:1px solid #4a1010;border-radius:10px;padding:14px;font-size:13px;color:#ff8080;margin-bottom:16px}
.success-box{background:#0a2a20;border:1px solid var(--green);border-radius:10px;padding:14px;font-size:13px;color:var(--green);margin-bottom:16px}
</style>
</head>
<body>

<div class="card" id="card">
  <div class="mark">A</div>
  <div id="content">
    <div class="spinner"></div>
    <p id="statusText">Checking your invitation...</p>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const token = params.get('token');
const content = document.getElementById('content');

async function checkLoginStatus() {
  try {
    const res = await fetch('/api/auth/me');
    if (!res.ok) return null;
    const data = await res.json();
    return data.user;
  } catch (e) { return null; }
}

async function init() {
  if (!token) {
    content.innerHTML = `<div class="error-box">This invitation link is missing or malformed.</div>
      <a href="/" class="btn btn-ghost">Go to Homepage</a>`;
    return;
  }

  let invite;
  try {
    const res = await fetch('/api/team/invite/' + token);
    const data = await res.json();
    if (!res.ok) {
      content.innerHTML = `<div class="error-box">${data.error || 'This invitation is no longer valid.'}</div>
        <a href="/" class="btn btn-ghost">Go to Homepage</a>`;
      return;
    }
    invite = data;
  } catch (e) {
    content.innerHTML = `<div class="error-box">Connection error. Please try again.</div>`;
    return;
  }

  const currentUser = await checkLoginStatus();

  if (!currentUser) {
    // Not logged in — send them to sign up or log in with this exact email,
    // then have them return to this same link to finish joining.
    content.innerHTML = `
      <h1>You're invited!</h1>
      <p><strong>${invite.ownerName}</strong> has invited you to join their team on Arreyon Consult, using <strong>${invite.memberEmail}</strong>.</p>
      <p>Create an account or log in with that email address, then come back to this page (or click the link in your invite email again) to finish joining.</p>
      <a href="/auth?mode=signup&email=${encodeURIComponent(invite.memberEmail)}" class="btn">Create Account</a>
      <a href="/auth?mode=login&email=${encodeURIComponent(invite.memberEmail)}" class="btn btn-ghost">I already have an account</a>
    `;
    return;
  }

  if (currentUser.email.toLowerCase() !== invite.memberEmail.toLowerCase()) {
    content.innerHTML = `
      <h1>Wrong account</h1>
      <div class="error-box">This invitation was sent to <strong>${invite.memberEmail}</strong>, but you're logged in as <strong>${currentUser.email}</strong>.</div>
      <p>Please log out and log back in with the invited email address.</p>
      <a href="/auth?mode=login&email=${encodeURIComponent(invite.memberEmail)}" class="btn btn-ghost">Switch Account</a>
    `;
    return;
  }

  content.innerHTML = `
    <h1>You're invited!</h1>
    <p><strong>${invite.ownerName}</strong> has invited you to join their team on Arreyon Consult. Accepting will give you access to their account based on the permissions they've granted you.</p>
    <button class="btn" id="acceptBtn" onclick="acceptInvite()">Accept Invitation</button>
    <div id="acceptMsg" style="display:none;margin-top:12px"></div>
  `;
}

async function acceptInvite() {
  const btn = document.getElementById('acceptBtn');
  btn.disabled = true;
  btn.textContent = 'Joining...';

  try {
    const res = await fetch('/api/team/invite/' + token + '/accept', { method: 'POST' });
    const data = await res.json();
    const msgEl = document.getElementById('acceptMsg');
    msgEl.style.display = 'block';

    if (!res.ok) {
      btn.disabled = false;
      btn.textContent = 'Accept Invitation';
      msgEl.innerHTML = `<div class="error-box">${data.error || 'Failed to accept invitation.'}</div>`;
      return;
    }

    msgEl.innerHTML = `<div class="success-box">You've joined the team! Redirecting to your dashboard...</div>`;
    setTimeout(() => { window.location.href = '/dashboard'; }, 1500);
  } catch (e) {
    document.getElementById('acceptMsg').style.display = 'block';
    document.getElementById('acceptMsg').innerHTML = `<div class="error-box">Connection error. Please try again.</div>`;
    btn.disabled = false;
    btn.textContent = 'Accept Invitation';
  }
}

init();
</script>
</body>
</html>
